# Aml Store — Cloudflare Pages + Functions
# Doc: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name                   = "aml-store"
pages_build_output_dir = "."
compatibility_date     = "2024-09-23"
compatibility_flags    = ["nodejs_compat"]

# ── D1 Database ──────────────────────────────────────────────────────────────
# Creare il DB con: wrangler d1 create aml-orders
# Poi sostituire database_id con quello ottenuto dal comando
[[d1_databases]]
binding       = "DB"
database_name = "aml-orders"
database_id   = "72e06b2b-7366-4298-8fd9-ccbb4540ad79"

# ── R2: allegati omaggio (guida Copilot) ─────────────────────────────────────
# Bucket PRIVATO: il PDF non deve essere raggiungibile dal sito, viene solo letto
# dalla Function e allegato all'email d'ordine.
# Creazione:  wrangler r2 bucket create aml-store-guides
# Upload:     wrangler r2 object put aml-store-guides/guida-copilot-microsoft-365.pdf \
#               --file="C:/Users/Anton/Desktop/AmlStore_guide/guida-copilot-microsoft-365.pdf" \
#               --content-type=application/pdf --remote
[[r2_buckets]]
binding     = "GUIDES"
bucket_name = "aml-store-guides"

# ── Support realtime: Durable Objects in external Worker ────────────────────
# Il Worker di produzione aml-support-realtime e' stato deployato il
# 2026-08-24 (secret e VAPID dedicati, mai condivisi col preview) — vedi
# docs/adr/ADR-CHAT-001-runbook.md. CHAT_ENABLED resta "0": il binding qui
# sotto rende l'infrastruttura raggiungibile, non la accende. Vedi la nota
# accanto a CHAT_ENABLED piu' in basso prima di impostarlo a "1".
[[durable_objects.bindings]]
name        = "CHAT_CONVERSATIONS"
class_name  = "ConversationDurableObject"
script_name = "aml-support-realtime"

[[durable_objects.bindings]]
name        = "SUPPORT_HUB"
class_name  = "SupportHubDurableObject"
script_name = "aml-support-realtime"

# ── Variabili non-segrete (ok in repo) ───────────────────────────────────────
[vars]
SITE_ORIGIN     = "https://eurolicenze.com"
PAYPAL_BASE_URL = "https://api-m.paypal.com"
# Produzione = PayPal LIVE. Per lo sviluppo locale, .dev.vars sovrascrive con
# la sandbox (PAYPAL_BASE_URL + PAYPAL_CLIENT_ID/SECRET sandbox).

# Admin panel — Cloudflare Access JWT verification
# CF_ACCESS_AUD: Zero Trust → Access → Applications → [Admin App] → Overview → "Application Audience"
# CF_ACCESS_TEAM_DOMAIN: Zero Trust → Settings → Custom Pages → team domain (es. "xyz.cloudflareaccess.com")
CF_ACCESS_AUD         = "61bb5d94ba4477a21b272c98ef419414d508f3a3f5378f949c87b5bce2d403c1"
CF_ACCESS_TEAM_DOMAIN = "amlstore.cloudflareaccess.com"
ADMIN_ALLOWED_EMAILS  = "Info@amlstore.it,Desk@eurolicenze.com,Antonino.cardelli@outlook.it"
ADMIN_ALLOW_DELETE_ORDERS = "1"
ADMIN_ALLOW_DELETE_CARTS = "1"

# Support chat — attivata il 2026-08-24 per test reali in produzione, con
# alcune voci della checklist ancora aperte per scelta esplicita dell'utente
# (Safari iPhone non testato, Push reale da desktop non confermata fuori
# dalla rete di sviluppo, test di retention/purge non completato): vedi
# docs/adr/ADR-CHAT-001-implementation-plan.md §0.3. Rollback: CHAT_ENABLED=0.
CHAT_ENABLED = "1"
CHAT_GUEST_SESSION_DAYS = "180"
CHAT_GUEST_COOKIE_NAME = "__Host-aml_chat_guest"
CHAT_ARCHIVE_AFTER_DAYS = "30"
CHAT_RETENTION_DAYS = "180"
CHAT_SPAM_RETENTION_DAYS = "14"
CHAT_DELETE_GRACE_DAYS = "0"
CHAT_TOMBSTONE_RETENTION_DAYS = "30"
CHAT_RETENTION_BATCH_SIZE = "100"
CHAT_MAX_MESSAGE_LENGTH = "4000"
VAPID_PUBLIC_KEY = "BKq6sMBIln64cs9iXYVRChYg1sm-LhsX4hQSOzQMdSDe-gUX413p-o5J-zd5SlpE45buo2SswgWlHltudciH52Y"
VAPID_SUBJECT = "mailto:Info@amlstore.it"

# ── Segreti (MAI committare — impostare con `wrangler secret put <NAME>`) ────
# TOKEN_SECRET           — stringa random ≥32 caratteri per HMAC token thank-you
# FRAUD_HASH_SECRET      — stringa random ≥16 caratteri per HMAC rate-limit checkout (email)
# RESEND_API_KEY         — API key Resend (re_xxxx...)
# TRUSTPILOT_BCC         — indirizzo ...+token@invite.trustpilot.com
# STRIPE_SECRET_KEY      — sk_live_... (o sk_test_... in sviluppo)
# STRIPE_WEBHOOK_SECRET  — whsec_... da Stripe Dashboard > Webhooks (deve inviare
#                          anche l'evento payment_intent.succeeded)
# STRIPE_PUBLISHABLE_KEY — pk_live_... esposto al frontend via /api/stripe-config
#                          (dato pubblico); serve al Payment/Express Element di
#                          /it/checkout. Se assente il checkout on-page degrada
#                          su PayPal/bonifico.
# PAYPAL_CLIENT_ID       — Client ID PayPal LIVE (esposto al frontend via
#                          /api/paypal-config: è un dato pubblico)
# PAYPAL_CLIENT_SECRET   — Client Secret PayPal LIVE (solo server-side)
# PAYPAL_WEBHOOK_ID      — Webhook ID da PayPal Dashboard → Apps & Credentials →
#                          [App] → Webhooks → aggiungi endpoint
#                          https://eurolicenze.com/api/webhooks/paypal, evento
#                          "Payment capture completed". Senza questo secret
#                          /api/webhooks/paypal rifiuta ogni richiesta (401) —
#                          va configurato DOPO il deploy, quando l'URL esiste.
# Live credentials: Cloudflare Pages → Settings → Environment variables (Production).
# Vedi GO-LIVE.md per la checklist completa di messa online.
# CHAT_GUEST_SESSION_SECRET  — HMAC secret guest cookie, random >=32 caratteri
# CHAT_CONTACT_LOOKUP_SECRET — HMAC secret lookup email, random >=32 caratteri
# VAPID_PRIVATE_KEY          — private key Web Push (fase Push)
# VAPID_SUBJECT              — mailto: o URL identificativo VAPID

# ══════════════════════════════════════════════════════════════════════════
# Ambiente preview (branch chat/adr-chat-001 → build automatica Cloudflare
# Pages su ogni push, alias di branch: chat-adr-chat-001.amlstore-site.pages.dev)
#
# ATTENZIONE — i binding non sono ereditabili: appena una sezione [env.preview]
# sovrascrive UN SOLO binding (qui i D1/DO), Cloudflare Pages smette di
# applicare ANCHE gli altri binding top-level a quell'ambiente (R2, e i [vars]
# in blocco) finché non vengono ridichiarati qui sotto. Aggiungere in futuro
# una var/binding SOLO in cima al file, senza toccare anche [env.preview],
# la renderebbe silenziosamente assente in preview.
# Fonte: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
# ══════════════════════════════════════════════════════════════════════════
[env.preview]

[[env.preview.d1_databases]]
binding       = "DB"
# D1 fisicamente separato da aml-orders (ADR-CHAT-001 §83): stesso schema
# (schema.sql + schema-stock-migration.sql + migrations/0002_chat_core.sql),
# zero dati reali di clienti/ordini.
database_name = "aml-store-preview"
database_id   = "07947b6c-2b3a-418e-8c33-2d745bbccfda"

[[env.preview.r2_buckets]]
binding     = "GUIDES"
bucket_name = "aml-store-guides"

[[env.preview.durable_objects.bindings]]
name        = "CHAT_CONVERSATIONS"
class_name  = "ConversationDurableObject"
script_name = "aml-support-realtime-preview"

[[env.preview.durable_objects.bindings]]
name        = "SUPPORT_HUB"
class_name  = "SupportHubDurableObject"
script_name = "aml-support-realtime-preview"

[env.preview.vars]
SITE_ORIGIN     = "https://chat-adr-chat-001.amlstore-site.pages.dev"
# Sandbox, mai LIVE: una build di preview non deve poter processare un
# pagamento reale. PAYPAL_CLIENT_ID/SECRET sandbox non sono ancora impostati
# come secret Pages preview — finché mancano, il checkout PayPal fallisce
# chiuso (nessun rischio), non silenziosamente verso l'account LIVE.
PAYPAL_BASE_URL = "https://api-m.sandbox.paypal.com"

# Stessa Access app di produzione: e' scoped sull'hostname aml-store.com, non
# copre questo hostname .pages.dev, quindi qui resta un valore innocuo finché
# non si aggiunge (dalla dashboard Zero Trust) un'applicazione Access anche per
# questo host — nel frattempo /admin/support su preview risponde 401 di suo.
CF_ACCESS_AUD         = "61bb5d94ba4477a21b272c98ef419414d508f3a3f5378f949c87b5bce2d403c1"
CF_ACCESS_TEAM_DOMAIN = "amlstore.cloudflareaccess.com"
ADMIN_ALLOWED_EMAILS  = "Info@amlstore.it,Desk@eurolicenze.com,Antonino.cardelli@outlook.it"
ADMIN_ALLOW_DELETE_ORDERS = "1"
ADMIN_ALLOW_DELETE_CARTS = "1"

CHAT_ENABLED = "1"
CHAT_GUEST_SESSION_DAYS = "180"
CHAT_GUEST_COOKIE_NAME = "aml_chat_guest_preview"
CHAT_ARCHIVE_AFTER_DAYS = "30"
CHAT_RETENTION_DAYS = "180"
CHAT_SPAM_RETENTION_DAYS = "14"
CHAT_DELETE_GRACE_DAYS = "0"
CHAT_TOMBSTONE_RETENTION_DAYS = "30"
CHAT_RETENTION_BATCH_SIZE = "100"
CHAT_MAX_MESSAGE_LENGTH = "4000"
VAPID_PUBLIC_KEY = "BPB7Rwy0hl22PwYciLbqAFlBDq_bISkX67Dc-8mySZHHMZQ8l6Jsq0D4dVQJHmZrrMBAggeWB-RoHNOKFQ0ikLU"
VAPID_SUBJECT = "mailto:Info@amlstore.it"

# Secret preview (già impostati con `wrangler pages secret put <NAME>
# --project-name=amlstore-site --env=preview`):
#   CHAT_GUEST_SESSION_SECRET, CHAT_CONTACT_LOOKUP_SECRET, TOKEN_SECRET
#   (TOKEN_SECRET preview è un valore dedicato, diverso da quello reale di
#   produzione che firma i link "grazie per l'ordine").
# Non impostati per preview (checkout/email restano inerti, senza rischio):
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_WEBHOOK_ID,
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY,
#   FRAUD_HASH_SECRET, TRUSTPILOT_BCC
