name = "aml-support-realtime"
main = "src/index.ts"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[d1_databases]]
binding = "CHAT_DB"
database_name = "aml-orders"
database_id = "72e06b2b-7366-4298-8fd9-ccbb4540ad79"

[[durable_objects.bindings]]
name = "CHAT_CONVERSATIONS"
class_name = "ConversationDurableObject"

[[durable_objects.bindings]]
name = "SUPPORT_HUB"
class_name = "SupportHubDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationDurableObject", "SupportHubDurableObject"]

[triggers]
crons = ["*/15 * * * *"]

[vars]
CHAT_ENABLED = "1"
CHAT_GUEST_SESSION_DAYS = "180"
CHAT_GUEST_COOKIE_NAME = "__Host-aml_chat_guest"
CHAT_ARCHIVE_AFTER_DAYS = "30"
CHAT_RETENTION_DAYS = "180"
CHAT_SPAM_RETENTION_DAYS = "14"
CHAT_DELETE_GRACE_DAYS = "0"
CHAT_TOMBSTONE_RETENTION_DAYS = "30"
CHAT_RETENTION_BATCH_SIZE = "100"
CHAT_MAX_MESSAGE_LENGTH = "4000"
SITE_ORIGIN = "https://aml-store.com"
VAPID_PUBLIC_KEY = "BKq6sMBIln64cs9iXYVRChYg1sm-LhsX4hQSOzQMdSDe-gUX413p-o5J-zd5SlpE45buo2SswgWlHltudciH52Y"
VAPID_SUBJECT = "mailto:Info@amlstore.it"

# ── Ambiente preview ──────────────────────────────────────────────────────
# Risorse fisicamente separate dalla produzione (ADR-CHAT-001 §83): D1, secret
# e VAPID dedicati. Deploy con: wrangler deploy --env preview
# (produce lo script "aml-support-realtime-preview", vedi convenzione Wrangler
# sul suffisso -<env>). I secret si impostano con:
#   wrangler secret put CHAT_GUEST_SESSION_SECRET --env preview
#   wrangler secret put CHAT_CONTACT_LOOKUP_SECRET --env preview
#   wrangler secret put VAPID_PRIVATE_KEY --env preview
[env.preview]
workers_dev = false

[[env.preview.d1_databases]]
binding = "CHAT_DB"
database_name = "aml-store-preview"
database_id = "07947b6c-2b3a-418e-8c33-2d745bbccfda"

[[env.preview.durable_objects.bindings]]
name = "CHAT_CONVERSATIONS"
class_name = "ConversationDurableObject"

[[env.preview.durable_objects.bindings]]
name = "SUPPORT_HUB"
class_name = "SupportHubDurableObject"

[env.preview.triggers]
crons = ["*/15 * * * *"]

[env.preview.vars]
CHAT_ENABLED = "1"
CHAT_GUEST_SESSION_DAYS = "180"
CHAT_GUEST_COOKIE_NAME = "aml_chat_guest_preview"
CHAT_ARCHIVE_AFTER_DAYS = "30"
CHAT_RETENTION_DAYS = "180"
CHAT_SPAM_RETENTION_DAYS = "14"
CHAT_DELETE_GRACE_DAYS = "0"
CHAT_TOMBSTONE_RETENTION_DAYS = "30"
CHAT_RETENTION_BATCH_SIZE = "100"
CHAT_MAX_MESSAGE_LENGTH = "4000"
# Sostituire con l'host reale della Pages preview deployment quando e' noto
# (es. https://chat-adr-chat-001.amlstore-site.pages.dev): finche' resta il
# placeholder, assertAllowedOrigin blocca ogni richiesta cross-origin, quindi
# il fallback e' "chiuso" e non "aperto a chiunque".
SITE_ORIGIN = "https://chat-preview.amlstore-site.pages.dev"
VAPID_PUBLIC_KEY = "BPB7Rwy0hl22PwYciLbqAFlBDq_bISkX67Dc-8mySZHHMZQ8l6Jsq0D4dVQJHmZrrMBAggeWB-RoHNOKFQ0ikLU"
VAPID_SUBJECT = "mailto:Info@amlstore.it"
